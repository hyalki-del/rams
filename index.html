<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGENDA.ARCH // Vector Engine</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="header">
        <div class="brand">SYSTEM // AGENDA.ARCH</div>
        <div class="header-controls">
            <div id="sync-status" class="status-indicator">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">OFFLINE READY</span>
            </div>
            <button id="btn-clear" type="button">Clear Active Layer</button>
            <button id="btn-sync" type="button" class="btn-primary">Sync Endpoint</button>
        </div>
    </header>

    <main class="main-layout">
        <aside class="sidebar">
            <div class="field-group">
                <label for="meta-date">Date Index</label>
                <input type="date" id="meta-date">
            </div>

            <div class="field-group">
                <label for="meta-topic">Tags / Topic</label>
                <input type="text" id="meta-topic" placeholder="e.g. #Elevation #Detail">
            </div>

            <div class="field-group">
                <label for="meta-summary">Summary (Scribble)</label>
                <textarea id="meta-summary" placeholder="Write entry summary..."></textarea>
            </div>

            <div class="field-group">
                <label>Active Ink Layer</label>
                <div class="segmented-control">
                    <button id="btn-layer-vector" type="button" class="active">Sketch (L2)</button>
                    <button id="btn-layer-annotation" type="button">Redline (L3)</button>
                </div>
            </div>

            <div class="field-group">
                <label>Background Blueprint</label>
                <input type="file" id="file-bg-input" accept="image/*" class="is-hidden">
                <label for="file-bg-input" class="btn-label">Upload Blueprint</label>
            </div>
        </aside>

        <section class="workspace" id="workspace">
            <div class="canvas-viewport" id="canvas-container">
                <canvas id="layer-bg"></canvas>
                <canvas id="layer-vector"></canvas>
                <canvas id="layer-annotation"></canvas>
            </div>
        </section>
    </main>

    <!-- Application Engine Stack -->
    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
