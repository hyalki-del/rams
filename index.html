<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ARCH_LOG // Daily Spatial Agenda</title>
  
  <!-- Replace existing viewport/apple meta tags in index.html -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <div id="app-container">
    <header>
      <div class="brand"><div class="brand-accent"></div><span>ARCH_LOG // AGENDA</span></div>
      
      <div class="date-shuffler">
        <button class="btn" id="prevDateBtn">[◄ PREV]</button>
        <span id="currentDateDisplay">2026.08.23</span>
        <button class="btn" id="nextDateBtn">[NEXT ►]</button>
      </div>

      <div class="action-group">
        <button class="btn btn-orange" id="addTopicBtn">+ ADD TOPIC</button>
        <button class="btn btn-orange" id="cloudSyncBtn">CLOUD SYNC</button>
        <button class="btn" id="exportBtn">EXPORT JSON</button>
      </div>
    </header>

    <div id="context-banner">
      <div id="activeTagsContainer"></div>
      <div id="storageStatus">STORAGE: INITIALIZING...</div>
    </div>

    <!-- Dynamic Scrollable Topic Workspace -->
    <main id="agendaViewport"></main>

    <footer>
      <span id="pointerMetrics">X: 0000 | Y: 0000 | P: 0.00</span>
      <span id="configStatus">CONFIG: UNLOADED</span>
    </footer>
  </div>

  <!-- Module Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
