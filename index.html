<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAMS V1.0 // UNIVERSAL SPATIAL LOGBOOK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="p-2 sm:p-6 min-h-screen flex flex-col items-center justify-start grid-bg">

    <!-- MAIN AGENDA SHEET (DIETER RAMS CLIPBOARD BOARD) -->
    <div class="w-full max-w-5xl bg-[#F4F4F0] rams-border p-4 sm:p-8 shadow-2xl relative min-h-[92vh] flex flex-col justify-between my-auto">
        
        <!-- HEADER ZONE -->
        <header class="border-b-2 border-[#1C1C1E] pb-4 mb-6">
            <div class="flex flex-wrap justify-between items-start gap-4">
                <div>
                    <div class="flex items-center gap-2">
                        <span class="w-3.5 h-3.5 bg-[#FF4800] inline-block"></span>
                        <h1 class="text-lg sm:text-xl font-black tracking-widest text-[#1C1C1E] uppercase">
                            RAMS_LOGBOOK // V1.0
                        </h1>
                    </div>
                    <p class="text-xs font-semibold italic text-slate-600 mt-1">
                        "Good design is as little design as possible." — Dieter Rams
                    </p>
                </div>

                <!-- DATE SHUFFLER -->
                <div class="flex items-center gap-2">
                    <button id="btnPrevDay" class="rams-button px-3 py-1.5 text-xs">◄ PREV</button>
                    <div class="rams-border bg-white px-3 py-1 text-center shadow-[2px_2px_0px_#1C1C1E] relative">
                        <input type="date" id="dateInput" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
                        <span id="dateDisplay" class="text-xs font-black uppercase tracking-wider">YYYY.MM.DD</span>
                    </div>
                    <button id="btnNextDay" class="rams-button px-3 py-1.5 text-xs">NEXT ►</button>
                    <button id="btnToday" class="rams-button px-3 py-1.5 text-xs bg-[#FF4800] text-white">TODAY</button>
                </div>
            </div>
        </header>

        <!-- TIME-GRID MATRIX (07:00 to 19:00 with 30-min precision) -->
        <section class="space-y-3 flex-1 overflow-y-auto pr-1" id="agendaGrid"></section>

        <!-- FOOTER METADATA & BACKUP OPERATIONS -->
        <footer class="mt-6 pt-3 border-t-2 border-[#1C1C1E] flex flex-wrap justify-between items-center text-[10px] font-bold text-slate-600 uppercase gap-2">
            <div class="flex gap-4">
                <span>SYSTEM: INDEXEDDB PERSISTENCE</span>
                <span id="syncStatus" class="text-[#FF4800]">STATUS: IDLE</span>
            </div>
            <div class="flex gap-2">
                <button id="btnExportJSON" class="rams-button px-2 py-1 text-[10px]">EXPORT BACKUP (.JSON)</button>
                <button id="btnImportJSON" class="rams-button px-2 py-1 text-[10px]">RESTORE BACKUP</button>
                <input type="file" id="fileImport" class="hidden" accept=".json">
            </div>
        </footer>
    </div>

    <!-- DRAFTING WORKSPACE MODAL (SLIDES FROM BOTTOM TO TOP) -->
    <div id="studioModal" class="fixed inset-0 z-50 bg-[#F4F4F0] flex flex-col justify-between overflow-hidden">
        
        <!-- TOP OVERLAY CONTROL BANNER -->
        <header class="h-14 border-b-2 border-[#1C1C1E] bg-[#F4F4F0] px-4 sm:px-6 flex justify-between items-center shrink-0 z-10">
            <div class="flex items-center gap-3">
                <span class="w-3 h-3 bg-[#FF4800]"></span>
                <span id="studioTopicTitle" class="text-xs sm:text-sm font-black uppercase tracking-widest text-[#1C1C1E]">
                    TOPIC: UNTITLED
                </span>
                <span id="studioTimeTag" class="text-[10px] font-bold bg-[#1C1C1E] text-white px-2 py-0.5">
                    00:00
                </span>
            </div>

            <div class="flex items-center gap-2">
                <button id="btnUndo" class="rams-button px-3 py-1 text-xs">UNDO</button>
                <button id="btnRedo" class="rams-button px-3 py-1 text-xs">REDO</button>
                <button id="btnCloseStudio" class="rams-button px-4 py-1 text-xs bg-[#1C1C1E] text-white">SAVE & CLOSE ✕</button>
            </div>
        </header>

        <!-- STACKED CANVAS ENGINE VIEWPORT -->
        <div id="canvasViewport" class="flex-1 relative overflow-hidden bg-[#FFFFFF] cursor-crosshair">
            <div class="absolute inset-0 grid-bg opacity-40 pointer-events-none"></div>
            <canvas id="bgCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-10"></canvas>
            <canvas id="drawCanvas" class="absolute inset-0 w-full h-full touch-none z-20"></canvas>

            <!-- ACTIVE LAYER BADGE (BOTTOM RIGHT) -->
            <div class="absolute bottom-4 right-4 z-30 pointer-events-none">
                <div class="rams-border bg-white/90 backdrop-blur-sm px-3 py-1.5 shadow-[2px_2px_0px_#1C1C1E] flex items-center gap-2">
                    <span class="text-[9px] font-black uppercase tracking-wider text-slate-500">ACTIVE LAYER:</span>
                    <span id="activeLayerDisplay" class="text-xs font-black uppercase tracking-widest text-[#FF4800]">L2 (VECTOR PENCIL)</span>
                </div>
            </div>
        </div>

        <!-- RIGHT-HAND FLOATING TOOLBAR -->
        <div class="absolute right-4 top-20 z-40 flex flex-col gap-3 items-end">
            <div class="floating-toolbar p-2 flex flex-col gap-3">
                
                <!-- PEN TOOL -->
                <button id="toolPen" class="w-10 h-10 rams-border bg-white flex items-center justify-center active-tool" title="Inking Pen & Palette">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                </button>

                <!-- ERASER TOOL -->
                <button id="toolEraser" class="w-10 h-10 rams-border bg-white flex items-center justify-center" title="Eraser Options">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>

                <!-- LAYERS MANAGER ("+" ICON) -->
                <button id="toolLayers" class="w-10 h-10 rams-border bg-white flex items-center justify-center relative" title="Layer Stack Setup">
                    <span class="text-lg font-black">+</span>
                </button>

                <!-- CAMERA / BLUEPRINT IMPORT -->
                <button id="toolCamera" class="w-10 h-10 rams-border bg-white flex items-center justify-center" title="Import Image / Blueprint">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><circle cx="12" cy="13" r="3"></circle></svg>
                </button>
                <input type="file" id="photoInput" class="hidden" accept="image/*">
            </div>

            <!-- FLYOUT PANELS -->
            <div id="penPropertiesPanel" class="flyout-panel p-3 flex flex-col gap-3 w-48 hidden">
                <span class="text-[10px] font-black uppercase text-slate-500 tracking-wider">STROKE & PALETTE</span>
                <div class="flex justify-between items-center">
                    <button class="btn-size w-7 h-7 rams-border flex items-center justify-center text-xs font-bold" data-size="1">1</button>
                    <button class="btn-size w-7 h-7 rams-border flex items-center justify-center text-xs font-bold active-size bg-slate-200" data-size="3">3</button>
                    <button class="btn-size w-7 h-7 rams-border flex items-center justify-center text-xs font-bold" data-size="6">6</button>
                    <button class="btn-size w-7 h-7 rams-border flex items-center justify-center text-xs font-bold" data-size="12">12</button>
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-slate-200">
                    <div class="color-dot active" style="background: #1C1C1E;" data-color="#1C1C1E"></div>
                    <div class="color-dot" style="background: #FF4800;" data-color="#FF4800"></div>
                    <div class="color-dot" style="background: #0055FF;" data-color="#0055FF"></div>
                    <div class="color-dot" style="background: #009944;" data-color="#009944"></div>
                </div>
            </div>

            <div id="eraserPropertiesPanel" class="flyout-panel p-3 flex flex-col gap-2 w-44 hidden">
                <span class="text-[10px] font-black uppercase text-slate-500 tracking-wider">ERASER MODES</span>
                <button id="btnEraserStroke" class="rams-button px-2 py-1 text-[10px] text-left">PRECISION ERASER</button>
                <button id="btnEraserClearAll" class="rams-button px-2 py-1 text-[10px] text-left text-red-600">ERASE ALL MARKS</button>
            </div>

            <div id="layerPropertiesPanel" class="flyout-panel p-3 flex flex-col gap-2 w-56 hidden">
                <span class="text-[10px] font-black uppercase text-slate-500 tracking-wider">SELECT ACTIVE LAYER</span>
                <div class="space-y-1.5">
                    <button class="btn-layer-select w-full p-2 rams-border text-left text-xs font-extrabold flex justify-between items-center" data-layer="L3">
                        <span>L3: REDLINE MARKUP</span>
                        <span class="layer-status text-[9px] text-slate-400">INACTIVE</span>
                    </button>
                    <button class="btn-layer-select w-full p-2 rams-border text-left text-xs font-extrabold flex justify-between items-center bg-slate-100" data-layer="L2">
                        <span>L2: VECTOR PENCIL</span>
                        <span class="layer-status text-[9px] text-[#FF4800]">ACTIVE</span>
                    </button>
                    <button class="btn-layer-select w-full p-2 rams-border text-left text-xs font-extrabold flex justify-between items-center" data-layer="L1">
                        <span>L1: PHOTO OVERLAY</span>
                        <span class="layer-status text-[9px] text-slate-400">IMAGE</span>
                    </button>
                </div>
                <div class="pt-2 border-t border-slate-200">
                    <button id="btnPurgePhoto" class="w-full text-left text-[10px] text-red-600 font-bold uppercase hover:underline">
                        PURGE LAYER 1 IMAGE
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- DIALOG MODAL: TOPIC CREATION & TIME CONFIGURATION (1000ms HOLD) -->
    <dialog id="topicCreateModal" class="rams-border p-5 bg-white shadow-2xl backdrop:bg-black/50 w-full max-w-sm">
        <form method="dialog" id="formCreateTopic" class="space-y-4">
            <h3 class="text-xs font-black uppercase tracking-widest border-b border-[#1C1C1E] pb-2 text-[#1C1C1E]">
                CREATE NEW WORKSPACE TOPIC
            </h3>
            
            <div>
                <label class="text-[10px] font-black text-slate-500 uppercase tracking-wider block mb-1">TOPIC TITLE / PROJECT ID</label>
                <input type="text" id="inputTopicTitle" required placeholder="E.G., SITE REDLINE / CONCEPT SKETCH" class="w-full rams-border p-2 text-xs font-bold uppercase focus:outline-none focus:border-[#FF4800]">
            </div>

            <div>
                <label class="text-[10px] font-black text-slate-500 uppercase tracking-wider block mb-1">TIME SLOT ALLOCATION</label>
                <select id="selectTopicTime" class="w-full rams-border p-2 text-xs font-bold uppercase bg-white focus:outline-none focus:border-[#FF4800]">
                    <!-- Dynamically populated 30-min options -->
                </select>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button type="button" id="btnCancelCreateTopic" class="rams-button px-3 py-1.5 text-xs">CANCEL</button>
                <button type="submit" id="btnConfirmCreateTopic" class="rams-button px-4 py-1.5 text-xs bg-[#1C1C1E] text-white">CREATE TOPIC</button>
            </div>
        </form>
    </dialog>

    <!-- DIALOG MODAL: TOPIC ACTIONS CONTEXT MENU (500ms HOLD) -->
    <dialog id="topicContextModal" class="rams-border p-4 bg-white shadow-2xl backdrop:bg-black/40">
        <div class="flex flex-col gap-2.5 min-w-[200px]">
            <h3 class="text-[10px] font-black uppercase tracking-widest border-b pb-2 text-slate-500">TOPIC OPTIONS</h3>
            <button id="ctxEdit" class="rams-button px-3 py-2 text-xs text-left">EDIT TITLE</button>
            <button id="ctxDelete" class="rams-button px-3 py-2 text-xs text-left text-red-600">DELETE TOPIC</button>
            <button id="ctxCancel" class="rams-button px-3 py-2 text-xs text-left bg-slate-100">CANCEL</button>
        </div>
    </dialog>

    <!-- MAIN MODULE BOOTSTRAPPER -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
