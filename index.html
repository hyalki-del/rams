<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARCH // LOGBOOK</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-paper text-graphite antialiased select-none overflow-hidden">

    <!-- MAIN SHELL: DIETER RAMS GRID AGENDABOOK -->
    <div id="appContainer" class="flex flex-col h-screen w-screen">
        
        <!-- HEADER / NAVIGATION BAR -->
        <header class="h-14 border-b border-divider flex items-center justify-between px-6 bg-paper shrink-0">
            <div class="flex items-center space-x-4">
                <span class="font-mono text-xs tracking-widest uppercase font-extrabold text-graphite">ARCH // LOGBOOK</span>
                <span class="text-divider">|</span>
                <div class="flex items-center space-x-2">
                    <button id="btnPrevDate" class="btn-ram-icon">◄</button>
                    <input type="date" id="datePicker" class="bg-transparent font-mono text-xs font-bold text-graphite focus:outline-none cursor-pointer">
                    <button id="btnNextDate" class="btn-ram-icon">►</button>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button id="btnExportJSON" class="btn-ram text-xs">EXPORT .JSON</button>
                <button id="btnImportJSON" class="btn-ram text-xs">IMPORT</button>
                <input type="file" id="fileImport" accept=".json" class="hidden">
            </div>
        </header>

        <!-- AGENDA SHEET WORKSPACE -->
        <main class="flex-1 overflow-y-auto p-6 md:p-12">
            <div class="max-w-4xl mx-auto border border-divider bg-paper-light shadow-ram p-8 min-h-[85vh] flex flex-col justify-between relative">
                
                <!-- TOPIC CREATION BAR -->
                <div class="space-y-6">
                    <div class="flex items-center justify-between border-b border-graphite pb-4">
                        <div>
                            <h1 id="displayDateHeading" class="font-mono text-xl font-black uppercase tracking-wider">2026.08.25</h1>
                            <p class="text-xs font-mono text-graphite-light mt-0.5">DAILY SITE RECORD & REDLINE LOGBOOK</p>
                        </div>
                        <button id="btnNewTopic" class="btn-ram-accent text-xs">+ NEW TOPIC CARD</button>
                    </div>

                    <!-- DYNAMIC TOPIC CARDS CONTAINER -->
                    <div id="topicContainer" class="grid grid-cols-1 gap-4">
                        <!-- Rendered by agenda.js -->
                    </div>
                </div>

                <!-- FOOTER METADATA -->
                <div class="pt-8 border-t border-divider flex justify-between items-center text-[10px] font-mono text-graphite-light">
                    <span>GRID SYSTEM: 1PX SOLID (#E2E2DC)</span>
                    <span>DIETER RAMS SYSTEM 01 // LOCAL-FIRST ENGINE</span>
                </div>
            </div>
        </main>
    </div>

    <!-- STUDIO DRAFTING MODAL WORKSPACE -->
    <div id="studioModal" class="fixed inset-0 bg-graphite/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-paper border-2 border-graphite w-full h-full max-w-6xl max-h-[92vh] flex flex-col shadow-ram-lg overflow-hidden">
            
            <!-- MODAL HEADER BAR -->
            <div class="h-12 border-b border-graphite px-4 bg-paper flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-3">
                    <span id="studioTopicBadge" class="bg-signal-orange text-white text-[10px] font-mono px-2 py-0.5 font-bold uppercase">#ELEVATION</span>
                    <h2 id="studioTopicTitle" class="font-mono text-xs font-extrabold uppercase truncate max-w-md">NORTH ELEVATION REDLINES</h2>
                </div>
                
                <div class="flex items-center space-x-2">
                    <button id="btnCloseStudio" class="btn-ram-danger text-xs px-3">CLOSE & SAVE</button>
                </div>
            </div>

            <!-- MODAL WORKSPACE GRID -->
            <div class="flex-1 grid grid-cols-1 md:grid-cols-12 overflow-hidden">
                
                <!-- LEFT SIDEBAR: HYBRID TEXT / METADATA NOTES -->
                <div class="md:col-span-4 border-r border-graphite p-4 flex flex-col space-y-4 bg-paper-light overflow-y-auto">
                    <div>
                        <label class="block font-mono text-[10px] uppercase font-bold text-graphite-light mb-1">TOPIC TITLE</label>
                        <input type="text" id="studioInputTitle" class="input-ram w-full font-mono text-xs font-bold">
                    </div>

                    <div>
                        <label class="block font-mono text-[10px] uppercase font-bold text-graphite-light mb-1">TOPIC TAGS (COMMA SEPARATED)</label>
                        <input type="text" id="studioInputTags" placeholder="ELEVATION, SITE, REVISION" class="input-ram w-full font-mono text-xs">
                    </div>

                    <div class="flex-1 flex flex-col">
                        <label class="block font-mono text-[10px] uppercase font-bold text-graphite-light mb-1">TYPED NOTES & SCRIBBLE SUMMARY</label>
                        <textarea id="studioInputNotes" placeholder="Write detailed text notes, field observations, or use iPadOS Scribble..." class="input-ram w-full flex-1 font-mono text-xs resize-none p-3 leading-relaxed"></textarea>
                    </div>
                </div>

                <!-- RIGHT MAIN: LAYERED CANVAS ENGINE CONTAINER -->
                <div class="md:col-span-8 flex flex-col relative bg-[#F4F4F0] overflow-hidden">
                    
                    <!-- STUDIO TOOLBAR OVERLAY -->
                    <div class="h-10 border-b border-divider px-3 flex items-center justify-between bg-paper shrink-0 z-30">
                        <!-- LAYER SELECTOR -->
                        <div class="flex items-center space-x-1">
                            <button id="btnLayerPencil" class="btn-layer active" data-layer="L2_Pencil">L2: PENCIL</button>
                            <button id="btnLayerRedline" class="btn-layer" data-layer="L3_Redline">L3: REDLINE</button>
                        </div>

                        <!-- DRAWING TOOLS -->
                        <div class="flex items-center space-x-2">
                            <button id="btnToolPencil" class="btn-ram-tool active">INK</button>
                            <button id="btnToolEraser" class="btn-ram-tool">ERASER</button>
                            <span class="text-divider">|</span>
                            <button id="btnUndo" class="btn-ram-icon">↩</button>
                            <button id="btnRedo" class="btn-ram-icon">↪</button>
                            <button id="btnClearCanvas" class="btn-ram-icon text-signal-orange">✕</button>
                        </div>

                        <!-- PHOTO SUBSTRATE CONTROLS -->
                        <div class="flex items-center space-x-2">
                            <label for="imgLoader" class="btn-ram text-[10px] cursor-pointer">+ IMPORT IMAGE</label>
                            <input type="file" id="imgLoader" accept="image/*" class="hidden">
                            <button id="btnPurgeImage" class="btn-ram-danger text-[10px]">PURGE</button>
                        </div>
                    </div>

                    <!-- STACKED CANVAS VIEWPORT -->
                    <div id="canvasViewport" class="flex-1 relative touch-none overflow-hidden cursor-crosshair">
                        <canvas id="bgCanvas" class="absolute inset-0 pointer-events-none z-10"></canvas>
                        <canvas id="drawCanvas" class="absolute inset-0 z-20"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN ENGINE CONTROLLERS -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
